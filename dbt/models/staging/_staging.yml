version: 2

models:
  - name: stg_shopify__orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: order_value_eur
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: stg_meta__insights
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['spend_date', 'campaign_id']
    columns:
      - name: spend_eur
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
