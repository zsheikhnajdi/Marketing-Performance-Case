name: 'marketing_performance'
version: '1.0.0'
config-version: 2
require-dbt-version: ">=1.10.0"
profile: 'marketing_performance'

model-paths: ["models"]
test-paths: ["tests"]

vars:
  reporting_start_date: '2025-01-01'

# Der Schlüssel unter "models" muss exakt dem Projektnamen oben entsprechen.
# Sonst werden diese Einstellungen stillschweigend ignoriert.
models:
  marketing_performance:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
